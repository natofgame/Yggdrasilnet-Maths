name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Yggdrasilnet.Maths.csproj -c Release

      # Tests for this library live in the server repository (tests/).

      - name: Package
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          mkdir -p dist
          dotnet pack Yggdrasilnet.Maths.csproj -c Release --no-build -o dist
          cp bin/Release/netstandard2.1/Yggdrasilnet.Maths.dll LICENSE README.md dist/
          (cd dist && zip -q "Yggdrasilnet.Maths-${GITHUB_REF_NAME}.zip" Yggdrasilnet.Maths.dll LICENSE README.md && rm Yggdrasilnet.Maths.dll LICENSE README.md)

      - name: Upload artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Maths-packages
          path: dist/*

  release:
    name: Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Maths-packages

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*"
          generate_release_notes: true
          # Tags like v0.0.1-alpha are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
